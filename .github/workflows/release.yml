name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build and test
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package source bundle
        run: |
          zip -r "runtimelens-${GITHUB_REF_NAME}.zip" . \
            -x '.git/*' 'build/*' 'dist/*' 'runtimelens-*.zip'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/runtimelens.jar \
            "runtimelens-${GITHUB_REF_NAME}.zip" \
            --generate-notes \
            --title "RuntimeLens ${GITHUB_REF_NAME}"
