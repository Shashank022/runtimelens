name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtimelens-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid VERSION value: $VERSION"
            echo "Expected a semantic version such as 0.1.0 or 0.2.0-rc.1"
            exit 1
          fi

          MAJOR_MINOR="$(echo "$VERSION" | awk -F. '{print $1"."$2}')"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=v$MAJOR_MINOR" >> "$GITHUB_OUTPUT"

          echo "Publishing RuntimeLens v$VERSION"
          echo "Moving compatibility channel v$MAJOR_MINOR to this release"

      - name: Build and test
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package source bundle
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          zip -r "runtimelens-${RELEASE_TAG}.zip" . \
            -x '.git/*' 'build/*' 'dist/*' 'runtimelens-*.zip'

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Refusing to overwrite an immutable release."
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            dist/runtimelens.jar \
            "runtimelens-${RELEASE_TAG}.zip" \
            --generate-notes \
            --title "RuntimeLens ${RELEASE_TAG}"

      - name: Move minor compatibility tag
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL_TAG: ${{ steps.version.outputs.channel }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${CHANNEL_TAG}" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${CHANNEL_TAG}" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${CHANNEL_TAG}" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

          echo "${CHANNEL_TAG} now points to ${GITHUB_SHA}"
