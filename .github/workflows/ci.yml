name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build and test
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Smoke test CLI
        run: |
          java -jar dist/runtimelens.jar rules
          java -jar dist/runtimelens.jar scan examples/demo --format json --output build/demo.json
          java -jar dist/runtimelens.jar scan examples/demo --format sarif --output build/demo.sarif
