name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Build and test
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Smoke test CLI
        run: |
          java -jar dist/runtimelens.jar rules
          java -jar dist/runtimelens.jar scan examples/demo --format json --output build/demo.json
          java -jar dist/runtimelens.jar scan examples/demo --format sarif --output build/demo.sarif
